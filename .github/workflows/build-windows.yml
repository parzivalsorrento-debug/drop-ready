name: Build Drop Ready for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows project files
        run: flutter create --platforms=windows .

      - name: Download packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Create installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\drop_ready.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DropReadySetup-1.0.0
          path: installer/output/DropReadySetup-1.0.0.exe
          if-no-files-found: error
